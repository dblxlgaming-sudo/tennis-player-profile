<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Triple Threat factual player profiles for Tennis and WNBA.">
  <title>Player Profile | Triple Threat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="product-header">
      <div><p class="eyebrow">Triple Threat</p><h1>Player Profile</h1></div>
      <p class="product-purpose">Factual player context and performance</p>
    </header>
    <nav class="sport-tabs" aria-label="Choose sport">
      <button class="sport-tab" type="button" data-sport="tennis">Tennis</button>
      <button class="sport-tab" type="button" data-sport="wnba">WNBA</button>
    </nav>
    <section id="status" class="status" role="status">Loading published player data…</section>
    <section id="player-picker" class="picker" aria-labelledby="picker-title" hidden>
      <div class="picker-heading">
        <div><p class="eyebrow" id="picker-sport"></p><h2 id="picker-title">Choose a player</h2></div>
        <span id="player-count" class="count-badge"></span>
      </div>
      <label class="search-field"><span class="sr-only">Search players</span><input id="player-search" type="search" placeholder="Search players…" autocomplete="off"></label>
      <div id="player-results" class="player-results" role="list"></div>
    </section>
    <article id="profile" hidden></article>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
